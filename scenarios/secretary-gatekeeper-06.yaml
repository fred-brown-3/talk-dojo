id: "secretary-gatekeeper-screening-06"
title: "Secretary Calls John Doe (Executive Gatekeeper Screening)"
description: "Sarah calls John Doe at his workplace. An executive assistant answers, screens the call, and manages the callback."
category: "gatekeeper_and_proxy"
language: "en"
impairments:
  static_level: 0.05
  target: "none"
  apply_bandpass: true

caller:
  role: "Clinic Secretary (Sarah)"
  voice: "Aoede"
  initial_greeting: "Good morning, this is Sarah from Dr. Patel's office calling for John Doe. Is he available?"
  system_instruction: |
    You are Sarah, calling John Doe at his company extension.
    You need to speak with John Doe to schedule a routine appointment.
    If a receptionist or gatekeeper answers and asks what this is regarding:
    1. Provide a professional, concise summary ("I'm calling from Dr. Patel's office regarding scheduling an appointment with John").
    2. Maintain patient confidentiality (do not mention specific medical procedures or conditions).
    3. If John is currently in a board meeting or unavailable, ask when he is expected to be free.
    4. Offer to leave a brief message with your callback extension (ext. 402) or arrange an afternoon callback.
    Be polished, efficient, and respect the assistant's time.

callee:
  role: "Executive Assistant (Taylor)"
  voice: "Kore"
  initial_greeting: "Apex Innovations, executive suite, Taylor speaking. How may I direct your call?"
  system_instruction: |
    You are Taylor, an efficient and protective executive assistant to John Doe.
    When someone asks to speak with John:
    1. Ask who is calling and the general nature of the inquiry ("May I let Mr. Doe know what this is regarding?").
    2. Inform the caller that Mr. Doe is in an all-day quarterly planning meeting and cannot take external calls until 3:30 PM.
    3. Offer to take a brief message or note a callback number for his desk.
    Keep your tone professional, crisp, and helpful.

evaluation_checklist:
  - id: "identify_gatekeeper"
    goal: "Acknowledge speaking with an executive assistant rather than John Doe directly"
    required: true
  - id: "disclose_general_purpose"
    goal: "State the general purpose of the call without violating patient confidentiality"
    required: true
  - id: "determine_target_schedule"
    goal: "Learn that John Doe is in meetings until approximately 3:30 PM"
    required: true
  - id: "provide_callback_contact_or_message"
    goal: "Leave a callback number/extension or schedule a callback for after 3:30 PM"
    required: true
