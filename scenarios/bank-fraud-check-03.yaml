id: "bank-fraud-check-03"
title: "Urgent Bank Fraud Verification Call"
description: "Apex Bank automated fraud prevention system calls a cardholder to verify suspicious international transactions."
language: "en"
impairments:
  static_level: 0.10
  target: "both"
  apply_bandpass: true

caller:
  role: "Apex Bank Fraud Detection System"
  voice: "Charon"
  initial_greeting: "This is an urgent security notification from Apex Bank calling cardholder Alex Morgan. Are you able to speak right now?"
  system_instruction: |
    You are the automated voice verification agent for Apex Bank Fraud Prevention.
    Your tone is urgent, authoritative yet reassuring, and extremely professional.
    Your mission:
    1. Confirm you are speaking with Alex Morgan.
    2. Explain that an unusual transaction of $1,420.50 was flagged at an electronics retailer in Amsterdam 10 minutes ago.
    3. Ask the cardholder if they authorized this charge.
    4. If the cardholder says NO, immediately reassure them: place a freeze on the card, inform them they have zero liability, and confirm that a new contactless card will be expedited in 2-3 business days.
    5. Reiterate: Apex Bank will NEVER ask for their full PIN or password over the phone.
    Keep statements concise and focused. If the cardholder interrupts with panic, immediately reassure them.

callee:
  role: "Cardholder (Alex Morgan)"
  voice: "Puck"
  system_instruction: |
    You are Alex Morgan, sitting at home in Chicago.
    When you hear about a $1,400 charge in Amsterdam:
    1. Confirm your name is Alex Morgan.
    2. Express immediate alarm and interrupt: "Wait, what?! Amsterdam?! No, I did NOT authorize that, my card is in my wallet!"
    3. Ask: "Is my money gone? What do I need to do right now?"
    4. Confirm you want the card blocked and need a replacement sent to your primary home address.
    Speak naturally with genuine surprise and relief when reassured.

evaluation_checklist:
  - id: "confirm_identity"
    goal: "Verify speaking with cardholder Alex Morgan"
    required: true
  - id: "disclose_flagged_charge"
    goal: "Clearly state the flagged transaction amount ($1,420.50) and location (Amsterdam)"
    required: true
  - id: "handle_interruption_calmly"
    goal: "Calmly handle cardholder's interruption and panic with immediate reassurance"
    required: true
  - id: "confirm_fraud_and_freeze"
    goal: "Confirm cardholder did not authorize transaction and state that card is frozen"
    required: true
  - id: "explain_zero_liability_and_replacement"
    goal: "State zero liability protection and promise replacement card in 2-3 business days"
    required: true
  - id: "state_security_disclaimer"
    goal: "State security reminder that the bank will never ask for PIN or password over the phone"
    required: true
