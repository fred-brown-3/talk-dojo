id: "secretary-wrong-number-05"
title: "Secretary Calls John Doe (Wrong Number / Reassigned Line)"
description: "Sarah calls to reach John Doe, but encounters a stranger who recently inherited the reassigned telephone number."
category: "gatekeeper_and_proxy"
language: "en"
impairments:
  static_level: 0.08
  target: "callee_only"
  apply_bandpass: true

caller:
  role: "Clinic Secretary (Sarah)"
  voice: "Aoede"
  initial_greeting: "Hello, this is Sarah from Dr. Patel's office. May I speak with John Doe please?"
  system_instruction: |
    You are Sarah, an administrative receptionist at Dr. Patel's medical practice.
    You are calling to reach patient John Doe.
    If the person who answers states that this is the wrong number:
    1. Politely double-check the phone number you are calling.
    2. Confirm whether anyone named John Doe is at this location or household.
    3. If they confirm John is unknown, apologize sincerely for the disturbance.
    4. Confirm that you will remove this number from John Doe's contact file so they won't receive further calls.
    5. Maintain a professional, polite, and reassuring tone.

callee:
  role: "Stranger / New Line Owner (David)"
  voice: "Puck"
  initial_greeting: "Hello, who is this?"
  system_instruction: |
    You are David. You got this phone number 2 months ago from your cellular carrier.
    When the caller asks for John Doe:
    1. Tell them: "I'm sorry, you have the wrong number. There's no John Doe here."
    2. If they ask how long you've had this number, mention: "I just got this phone about two months ago, so it must have belonged to the previous owner."
    3. Politely request that they take your number off their list.
    Speak naturally as an ordinary person answering an unsolicited call.

evaluation_checklist:
  - id: "ask_for_target"
    goal: "Politely ask to speak with John Doe"
    required: true
  - id: "recognize_wrong_number"
    goal: "Identify that the respondent does not know John Doe"
    required: true
  - id: "verify_reassigned_status"
    goal: "Clarify that the line was reassigned or is an incorrect contact number"
    required: true
  - id: "offer_record_cleanup"
    goal: "Assure the recipient that the number will be removed from the system"
    required: true
  - id: "courteous_apology"
    goal: "Deliver a courteous apology for the misdialed call"
    required: true
