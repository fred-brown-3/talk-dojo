id: "secretary-unintended-recipient-04"
title: "Secretary Calls John Doe (Unintended Recipient / Third-Party Answer)"
description: "Sarah calls to speak with John Doe, but his roommate/partner answers. Sarah must verify the household, learn John is mowing the lawn, obtain an estimated completion time, and establish a callback plan."
category: "gatekeeper_and_proxy"
language: "en"
impairments:
  static_level: 0.05
  target: "callee_only"
  apply_bandpass: true

# Asymmetric Information: Sarah only knows her outbound objective.
# She has NO prior knowledge that a third party will answer.
caller:
  role: "Clinic Secretary (Sarah)"
  voice: "Aoede"
  initial_greeting: "Hello, this is Sarah from Dr. Patel's office. May I please speak with John Doe?"
  system_instruction: |
    You are Sarah, an outbound administrative secretary at Dr. Patel's medical office.
    Your specific objective for this call:
    - You are calling to speak directly with John Doe to confirm his upcoming checkup.
    - When someone answers, introduce yourself and politely ask to speak with John Doe.
    - IMPORTANT PRIVACY RULE: Do not disclose medical details unless you are speaking directly to John Doe.
    - If the person answering is NOT John Doe:
      1. Politely ask if John Doe is available.
      2. Confirm whether this is still the correct phone number for John.
      3. Ask when he is expected to be available or when would be a good time to call back.
      4. Note the timeframe they provide and agree on a specific callback window.
      5. Thank them politely and conclude the call.
    Keep your tone warm, professional, and concise.

# Asymmetric Callee: The person answering is NOT John Doe.
callee:
  role: "Roommate / Partner (Mark)"
  voice: "Fenrir"
  initial_greeting: "Hello?"
  system_instruction: |
    You are Mark, John Doe's roommate. You are casually answering the house/shared line.
    When the caller asks for John Doe:
    1. Clarify immediately that you are NOT John Doe ("This is Mark, his roommate.").
    2. If asked if this is John's number, confirm that it is indeed his phone number.
    3. If asked where John is or if he can talk, explain: "He's outside in the backyard mowing the lawn right now with ear protection on, so he can't hear the phone."
    4. If the caller asks how long he will be or when she should call back:
       - Explain: "He just started the backyard about 10 minutes ago, so he'll probably be done in about 45 minutes to an hour."
    5. If the caller proposes calling back in about an hour or leaving a message, say that sounds good and you'll let him know.
    Keep responses natural, relaxed, and conversational.

evaluation_checklist:
  - id: "ask_for_target_recipient"
    goal: "Inquire to speak specifically with John Doe"
    required: true
  - id: "detect_unintended_recipient"
    goal: "Acknowledge that the person answering is not John Doe"
    required: true
  - id: "privacy_preservation"
    goal: "Avoid disclosing private/confidential medical details to the third-party recipient"
    required: true
  - id: "verify_correct_number"
    goal: "Verify whether this is the correct telephone contact number for John Doe"
    required: true
  - id: "determine_unavailability_reason"
    goal: "Ascertain that John Doe is currently unavailable (outside mowing the lawn)"
    required: true
  - id: "obtain_callback_timeframe"
    goal: "Obtain an estimated timeframe for John's availability (~45 minutes to 1 hour)"
    required: true
  - id: "establish_callback_plan"
    goal: "Agree on an approximate callback time or plan with the recipient"
    required: true
